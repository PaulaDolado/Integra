# La llama la base de datos (pg_net), no la app: se autentica con la cabecera
# x-integra-secreto en lugar de con el JWT de un usuario
[functions.notificar]
verify_jwt = false

# La pide Google Calendar (u otro calendario) sin iniciar sesión: el token secreto
# de cada persona, en la URL, hace de llave
[functions.calendario-ics]
verify_jwt = false

# Google vuelve a /google-calendar/callback sin sesión de Integra; las demás
# peticiones llevan el JWT y la propia función lo comprueba
[functions.google-calendar]
verify_jwt = false
