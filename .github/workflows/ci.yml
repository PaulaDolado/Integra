name: Comprobaciones

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma PR cancela la comprobación anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Comprueba que compila; no necesita las claves de Supabase
      - name: Build
        run: npm run build

      - name: Dependencias de producción
        run: npm audit --omit=dev
