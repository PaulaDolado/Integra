name: Tests end-to-end

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Todas las ejecuciones comparten el proyecto de Supabase de pruebas: de una en una
concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    # Sin el proyecto de pruebas configurado no se ejecuta (README, «Tests end-to-end»)
    if: ${{ vars.E2E_SUPABASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      # Solo para comprobar que los tests no apuntan nunca a producción
      E2E_URL_PRODUCCION: ${{ secrets.VITE_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Navegador
        run: npx playwright install --with-deps chromium

      - name: Tests end-to-end
        run: npm run test:e2e

      # Informe con capturas y trazas de los tests que fallen
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: informe-e2e
          path: playwright-report/
          retention-days: 7
